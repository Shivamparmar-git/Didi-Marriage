<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Root Drive Manager</title>
  <style>
    /* --- CSS (Base) --- */
    :root {
      --bg-color: #0d1117; --card-bg: #161b22; --text-color: #e6edf3;
      --accent: #2f81f7; --hover-bg: #21262d; --border-color: #30363d;
      --overlay-bg: rgba(0, 0, 0, 0.95);
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-color); color: var(--text-color); font-family: var(--font-stack); padding: 2rem; }
    .app-container { max-width: 1200px; margin: 0 auto; }
    
    .breadcrumbs {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      background: var(--card-bg); padding: 1rem 1.5rem; border-radius: 8px;
      border: 1px solid var(--border-color); margin-bottom: 2rem; font-size: 1.1rem;
    }
    .breadcrumb-item { cursor: pointer; color: var(--accent); font-weight: 500; transition: color 0.2s; }
    .breadcrumb-item:hover { text-decoration: underline; }
    .breadcrumb-separator { color: #8b949e; user-select: none; }
    .breadcrumb-current { color: var(--text-color); font-weight: 600; cursor: default; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem; }
    .status-msg { text-align: center; padding: 3rem; font-size: 1.1rem; color: #8b949e; width: 100%; grid-column: 1 / -1; }

    .item-card {
      background-color: var(--card-bg); border-radius: 8px; overflow: hidden; cursor: pointer;
      border: 1px solid var(--border-color); transition: transform 0.2s, border-color 0.2s, background-color 0.2s;
      display: flex; flex-direction: column;
    }
    .item-card:hover { transform: translateY(-4px); border-color: var(--accent); background-color: var(--hover-bg); }
    
    .folder-card { flex-direction: row; align-items: center; padding: 1rem; }
    .folder-card .icon { font-size: 2rem; margin-right: 15px; }
    .folder-card .info { flex: 1; overflow: hidden; }
    .folder-card .info p { margin: 0; font-weight: 500; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
    
    .media-thumb { width: 100%; height: 160px; position: relative; background: #000; }
    .media-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .media-info { padding: 0.8rem 1rem; border-top: 1px solid var(--border-color); }
    .media-info p { margin: 0; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .video-icon {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.6); border-radius: 50%; width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center; color: white; padding-left: 4px; z-index: 10; font-size: 1.2rem;
    }

    body.no-scroll { overflow: hidden; }

    /* =========================================
       CLEAN LIGHTBOX & POPUP CSS
    ========================================= */
    #lightbox { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100dvh; 
      background-color: var(--overlay-bg); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      z-index: 1000; 
      opacity: 0; 
      pointer-events: none; 
      transition: opacity 0.3s ease; 
    }
    #lightbox.active { opacity: 1; pointer-events: auto; }
    
    .lightbox-content { 
      position: relative; 
      width: 100%; 
      height: 100%; 
      display: flex; 
      flex-direction: column; 
      justify-content: center;
      align-items: center;
    }

    .close-btn { 
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0,0,0,0.5); 
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff; 
      font-size: 2rem; 
      cursor: pointer; 
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      z-index: 1020;
      transition: background 0.2s, transform 0.2s;
    }
    .close-btn:hover { background: rgba(0,0,0,0.8); transform: scale(1.05); }

    #media-container { 
      width: 100%; 
      height: 100%; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      position: relative;
    }

    /* Standard Popup for Images */
    #media-container img { 
      max-width: 90%; 
      max-height: 85vh; 
      object-fit: contain; 
      border-radius: 8px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    
    /* Clean, Standard Popup for Videos */
    .popup-video-wrapper {
      width: 90%;
      max-width: 1000px;
      height: 75vh;
      background: #000;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .popup-video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    
    #lightbox-caption { 
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1rem; 
      color: rgba(255,255,255,0.8); 
      text-align: center; 
      z-index: 1010;
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80%;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    
    .nav-touch { 
      position: absolute; 
      top: 50%; 
      transform: translateY(-50%);
      width: 50px; 
      height: 50px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      opacity: 0; 
      cursor: pointer; 
      border: none; 
      background: rgba(0,0,0,0.4); 
      border-radius: 50%;
      color: white; 
      z-index: 1015; 
      transition: opacity 0.2s, background 0.2s;
    }
    .nav-touch:hover { background: rgba(0,0,0,0.7); }
    @media (hover: hover) { .lightbox-content:hover .nav-touch { opacity: 1; } }
    .nav-left { left: 20px; } 
    .nav-right { right: 20px; }
    .nav-arrow { font-size: 1.2rem; }

    /* =========================================
       MOBILE OPTIMIZATIONS (FIXED DRIVE CONTROLS)
    ========================================= */
    @media (max-width: 768px) {
      body { padding: 1rem; }
      .breadcrumbs { padding: 0.8rem 1rem; font-size: 0.95rem; margin-bottom: 1.5rem; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
      .media-thumb { height: 140px; }
      
      .nav-touch { opacity: 0.8; width: 40px; height: 40px; }
      .nav-left { left: 5px; } 
      .nav-right { right: 5px; }
      .close-btn { top: 10px; right: 10px; width: 40px; height: 40px; font-size: 1.8rem; background: rgba(0,0,0,0.7); }
      
      /* THE FIX: Give the iframe ample vertical height (85vh) so Google Drive 
         can render its stacked mobile controls without squishing or clipping them. */
      .popup-video-wrapper {
        width: 100%;
        height: 85vh; /* Ample room for both video and mobile controls */
        border-radius: 0; /* Sits flush against the screen edges */
        box-shadow: none;
      }
      
      #lightbox-caption { display: none; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="breadcrumbs" id="breadcrumbs"></div>
    <div class="grid" id="grid">
      <div class="status-msg">Loading Drive files...</div>
    </div>
  </div>

  <div id="lightbox">
    <div class="lightbox-content">
      <button class="close-btn" id="close-btn">&times;</button>
      <button class="nav-touch nav-left" id="prev-btn"><span class="nav-arrow">&#10094;</span></button>
      <div id="media-container"></div>
      <button class="nav-touch nav-right" id="next-btn"><span class="nav-arrow">&#10095;</span></button>
      <p id="lightbox-caption"></p>
    </div>
  </div>

  <script>
    /* =========================================
       1. MULTI-ROOT CONFIGURATION
    ========================================= */
    const API_KEY = 'INJECT_API_KEY';
    
    const ROOT_FOLDERS = [
      { id: 'INJECT_FOLDER_ID_1', name: 'Folder 1' },
      { id: 'INJECT_FOLDER_ID_2', name: 'Folder 2' },
      { id: 'INJECT_FOLDER_ID_3', name: 'Folder 3' },
      { id: 'INJECT_FOLDER_ID_4', name: 'Folder 4' }
    ];

    /* --- STATE VARIABLES --- */
    let pathHistory = []; 
    let currentFolderMedia = []; 
    let currentLightboxIndex = -1;

    const grid = document.getElementById('grid');
    const breadcrumbsContainer = document.getElementById('breadcrumbs');
    const lightbox = document.getElementById('lightbox');
    const mediaContainer = document.getElementById('media-container');

    /* =========================================
       2. HISTORY API (BACK BUTTON SUPPORT)
    ========================================= */
    
    function init() {
      pathHistory = [{ id: 'HOME', name: 'Home' }];
      history.replaceState({ type: 'folder', pathHistory: pathHistory }, "", "?home");
      renderCurrentState();
    }

    window.addEventListener('popstate', (event) => {
      const state = event.state;
      if (!state) return;

      if (state.type === 'folder') {
        if (lightbox.classList.contains('active')) {
          closeLightboxUI();
          const oldFolderId = pathHistory[pathHistory.length - 1].id;
          const newFolderId = state.pathHistory[state.pathHistory.length - 1].id;
          if (oldFolderId === newFolderId) return; 
        }
        pathHistory = state.pathHistory;
        renderCurrentState();
      } 
      else if (state.type === 'lightbox') {
        openLightboxUI(state.index);
      }
    });

    function onFolderClick(folderId, folderName) {
      const safeName = folderName.replace(/&quot;/g, '"').replace(/\\'/g, "'");
      pathHistory.push({ id: folderId, name: safeName });
      history.pushState({ type: 'folder', pathHistory: pathHistory }, "", `?folder=${folderId}`);
      renderCurrentState();
    }

    function onBreadcrumbClick(index) {
      pathHistory = pathHistory.slice(0, index + 1);
      const target = pathHistory[pathHistory.length - 1];
      history.pushState({ type: 'folder', pathHistory: pathHistory }, "", target.id === 'HOME' ? "?home" : `?folder=${target.id}`);
      renderCurrentState();
    }

    /* =========================================
       3. RENDERING LOGIC
    ========================================= */

    function renderCurrentState() {
      renderBreadcrumbs();
      const current = pathHistory[pathHistory.length - 1];
      
      if (current.id === 'HOME') {
        renderHome();
      } else {
        fetchAndRenderDriveFolder(current.id);
      }
    }

    function renderBreadcrumbs() {
      breadcrumbsContainer.innerHTML = '';
      pathHistory.forEach((crumb, index) => {
        const isLast = index === pathHistory.length - 1;
        if (isLast) {
          breadcrumbsContainer.innerHTML += `<span class="breadcrumb-current">${crumb.name}</span>`;
        } else {
          breadcrumbsContainer.innerHTML += `
            <span class="breadcrumb-item" onclick="onBreadcrumbClick(${index})">${crumb.name}</span>
            <span class="breadcrumb-separator">/</span>
          `;
        }
      });
    }

    function renderHome() {
      grid.innerHTML = '';
      currentFolderMedia = []; 
      
      ROOT_FOLDERS.forEach(folder => {
        const safeName = folder.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        grid.innerHTML += `
          <div class="item-card folder-card" onclick="onFolderClick('${folder.id}', '${safeName}')">
            <div class="icon">&#128193;</div>
            <div class="info"><p title="${safeName}">${folder.name}</p></div>
          </div>
        `;
      });
    }

    async function fetchAndRenderDriveFolder(folderId) {
      grid.innerHTML = '<div class="status-msg">Loading contents...</div>';
      let allFiles = [];
      let pageToken = '';
      
      try {
        do {
          const q = `'${folderId}' in parents and trashed = false and (mimeType = 'application/vnd.google-apps.folder' or mimeType contains 'image/' or mimeType contains 'video/')`;
          let url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=nextPageToken,files(id,name,mimeType,thumbnailLink)&orderBy=folder,name&pageSize=1000&key=${API_KEY}`;
          if (pageToken) url += `&pageToken=${pageToken}`;

          const response = await fetch(url);
          const data = await response.json();
          if (data.files) allFiles = allFiles.concat(data.files);
          pageToken = data.nextPageToken; 
        } while (pageToken);

        if (allFiles.length === 0) {
          grid.innerHTML = '<div class="status-msg">This folder is empty.</div>';
          currentFolderMedia = [];
          return;
        }

        renderGrid(allFiles);
      } catch (error) {
        console.error(error);
        grid.innerHTML = '<div class="status-msg" style="color: #ff7b72;">Failed to load folder. Check API key.</div>';
      }
    }

    function renderGrid(files) {
      grid.innerHTML = '';
      currentFolderMedia = []; 

      files.forEach(file => {
        const safeName = file.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        
        if (file.mimeType === 'application/vnd.google-apps.folder') {
          grid.innerHTML += `
            <div class="item-card folder-card" onclick="onFolderClick('${file.id}', '${safeName}')">
              <div class="icon">&#128193;</div>
              <div class="info"><p title="${safeName}">${file.name}</p></div>
            </div>
          `;
        } else {
          const isVideo = file.mimeType.includes('video');
          const mediaIndex = currentFolderMedia.length; 
          
          let thumbUrl = file.thumbnailLink || ''; 
          if (thumbUrl && thumbUrl.includes('=s220')) thumbUrl = thumbUrl.replace('=s220', '=s400');
          else if (!thumbUrl && !isVideo) thumbUrl = `https://lh3.googleusercontent.com/d/${file.id}=w400-h400-pq`;

          grid.innerHTML += `
            <div class="item-card media-card" onclick="userOpensLightbox(${mediaIndex})">
              <div class="media-thumb">
                ${isVideo ? '<div class="video-icon">&#9658;</div>' : ''}
                <img src="${thumbUrl}" alt="${safeName}" loading="lazy" />
              </div>
              <div class="media-info"><p title="${safeName}">${file.name}</p></div>
            </div>
          `;
          currentFolderMedia.push(file);
        }
      });
    }

    /* =========================================
       4. CLEAN LIGHTBOX INTEGRATION
    ========================================= */

    function userOpensLightbox(index) {
      history.pushState({ type: 'lightbox', pathHistory: pathHistory, index: index }, "", `?lightbox=true`);
      openLightboxUI(index);
    }

    function userClosesLightbox() {
      history.back(); 
    }

    function openLightboxUI(index) {
      if (index < 0 || index >= currentFolderMedia.length) return;
      currentLightboxIndex = index;
      
      const file = currentFolderMedia[currentLightboxIndex];
      const isVideo = file.mimeType.includes('video');
      
      mediaContainer.innerHTML = ''; 
      if (isVideo) {
        mediaContainer.innerHTML = `
          <div class="popup-video-wrapper">
            <iframe src="https://drive.google.com/file/d/${file.id}/preview" allow="autoplay" allowfullscreen></iframe>
          </div>
        `;
      } else {
        mediaContainer.innerHTML = `<img src="https://lh3.googleusercontent.com/d/${file.id}" alt="image">`;
      }

      document.getElementById('lightbox-caption').textContent = file.name;
      lightbox.classList.add('active');
      document.body.classList.add('no-scroll');
      document.addEventListener('keydown', handleKeyPress);
    }

    function closeLightboxUI() {
      lightbox.classList.remove('active');
      document.body.classList.remove('no-scroll');
      mediaContainer.innerHTML = ''; 
      currentLightboxIndex = -1;
      document.removeEventListener('keydown', handleKeyPress);
    }

    function navigateGallery(direction) {
      if (currentLightboxIndex === -1) return;
      let nextIndex = currentLightboxIndex + direction;
      if (nextIndex < 0) nextIndex = currentFolderMedia.length - 1;
      if (nextIndex >= currentFolderMedia.length) nextIndex = 0;
      
      history.replaceState({ type: 'lightbox', pathHistory: pathHistory, index: nextIndex }, "", `?lightbox=true`);
      openLightboxUI(nextIndex);
    }

    document.getElementById('close-btn').addEventListener('click', userClosesLightbox);
    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox || e.target.classList.contains('lightbox-content')) userClosesLightbox();
    });
    
    document.getElementById('prev-btn').addEventListener('click', (e) => { e.stopPropagation(); navigateGallery(-1); });
    document.getElementById('next-btn').addEventListener('click', (e) => { e.stopPropagation(); navigateGallery(1); });

    function handleKeyPress(e) {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'ArrowRight' || e.key === 'd') navigateGallery(1);
      if (e.key === 'ArrowLeft' || e.key === 'a') navigateGallery(-1);
      if (e.key === 'Escape') userClosesLightbox();
    }

    let touchStartX = 0; let touchEndX = 0;
    mediaContainer.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, {passive: true});
    mediaContainer.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const threshold = 50;
        if (touchEndX < touchStartX - threshold) navigateGallery(1);
        if (touchEndX > touchStartX + threshold) navigateGallery(-1);
    }, {passive: true});

    init();

  </script>
</body>
</html>
